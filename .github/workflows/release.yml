name: Publish VPM Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - Editor/**
      - Runtime/**
      - README.md
      - CHANGELOG.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' package.json)"
          package_id="$(jq -r '.name' package.json)"
          display_name="$(jq -r '.displayName' package.json)"
          test "$package_id" = "org.shiryu.unitymcp"
          test "$display_name" = "Shiryu.UnityMCP"
          test -n "$version"
          test "$version" != "null"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "zip=${package_id}-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build VPM package ZIP
        if: steps.existing.outputs.exists != 'true'
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/$ZIP_NAME" \
            package.json package.json.meta \
            package-icon.png package-icon.png.meta \
            Editor Editor.meta \
            Runtime Runtime.meta \
            README.md README.md.meta \
            LICENSE LICENSE.meta \
            CHANGELOG.md CHANGELOG.md.meta \
            THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md.meta
          sha256sum "dist/$ZIP_NAME" > "dist/$ZIP_NAME.sha256"

      - name: Verify ZIP manifest
        if: steps.existing.outputs.exists != 'true'
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -p "dist/$ZIP_NAME" package.json | jq -e '
            .name == "org.shiryu.unitymcp" and
            .displayName == "Shiryu.UnityMCP"
          ' >/dev/null

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/$ZIP_NAME" \
            "dist/$ZIP_NAME.sha256" \
            package.json \
            --target "$GITHUB_SHA" \
            --title "Shiryu.UnityMCP $VERSION" \
            --generate-notes
